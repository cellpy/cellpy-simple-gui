[project]
name = "cellpy-simple-gui"
# Single-sourced from the package, so a release cannot ship a wheel whose
# metadata and __version__ disagree — see [tool.hatch.version] below.
dynamic = ["version"]
description = "A simple, good-looking desktop GUI for exploring battery cell data with cellpy (>= 2.1)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "cellpy" }]
keywords = [
    "battery",
    "electrochemistry",
    "cellpy",
    "gui",
    "data-analysis",
    "cycling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "cellpy>=2.1.2",
    "tables",                 # read legacy .h5 cellpy files
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "plotly>=5.22",
    "pandas>=3.0",
    "polars>=1.0",
    "openpyxl>=3.1",
    "loguru>=0.7.3",
]

[project.urls]
Homepage = "https://github.com/cellpy/cellpy-simple-gui"
Repository = "https://github.com/cellpy/cellpy-simple-gui"
Issues = "https://github.com/cellpy/cellpy-simple-gui/issues"
"Deployment guide" = "https://github.com/cellpy/cellpy-simple-gui/blob/main/docs/deployment.md"
"Windows installer" = "https://github.com/cellpy/cellpy-simple-gui/blob/main/docs/windows-installer.md"
cellpy = "https://github.com/jepegit/cellpy"

[project.optional-dependencies]
# The native window. Not a core dependency: a served instance never opens one,
# and pulling GUI libraries into a server image is pure weight (#118).
desktop = ["pywebview>=6.0"]
export = ["kaleido>=0.1,<1.4"]        # server-side static image export (optional)
build = ["pyinstaller>=6.10"]         # freeze a Windows app (see packaging/)
dev = ["pytest>=8", "httpx>=0.27"]
mcp = ["mcp>=2.0"]                    # the MCP server prototype in examples/mcp/
e2e = ["playwright>=1.40"]            # browser GUI smoke tests (optional; see tests/test_gui_playwright.py)

[project.scripts]
cellpy-simple-gui = "cellpy_simple_gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/cellpy_simple_gui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cellpy_simple_gui"]

[tool.hatch.build.targets.sdist]
# The sdist is what someone builds from when a wheel will not do, so it carries
# the packaging recipes and tests as well as the source.
include = [
    "src/",
    "tests/",
    "packaging/",
    "docs/",
    "examples/",
    "tools/",
    "skills/",
    "llms.txt",
    "llms-full.txt",
    "Dockerfile",
    "docker-compose.yml",
    ".dockerignore",
    "README.md",
    "LICENSE",
    "CELLPY_PAINPOINTS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "essential: critical-path tests run in GitHub Actions CI",
    "e2e: Playwright GUI smoke tests (needs --extra e2e + playwright install chromium)",
]

[dependency-groups]
dev = [
    "issue-flow>=0.4.9.post1",
]
