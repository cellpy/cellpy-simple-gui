# Build and smoke-test the Windows installer (#124, #168).
#
# A reusable workflow, because two callers need the exact same build and must
# not drift: release.yml (on a v* tag) and continuous.yml (on every code change
# to main). Extracting it is what keeps "the installer CI tests" one thing.
#
# The rule from #117, and the reason this is not just a build: a bundle that
# compiles and then cannot load a cell is not a passing build. The frozen app
# is exercised over HTTP before the installer is compiled around it.
name: Windows installer

on:
  workflow_call:
    inputs:
      ref:
        description: "Tag, branch or SHA to build (defaults to the caller's commit)"
        type: string
        default: ""
      channel:
        description: >-
          Build channel appended to the version, e.g. "main" gives
          0.1.1+main.abc1234. Empty means a tagged release: plain 0.1.1 and
          the default installer file name.
        type: string
        default: ""
      output-base-name:
        description: >-
          Installer file name without .exe. Empty keeps installer.iss's
          default (cellpy-simple-gui-<version>-setup); a channel build passes
          a fixed name so its download URL never changes.
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded artifact holding dist/installer/*.exe"
        type: string
        default: windows-installer
    outputs:
      version:
        description: "__version__ the installer was built from"
        value: ${{ jobs.build.outputs.version }}
      build-id:
        description: "<channel>.<short sha>, or empty for a tagged release"
        value: ${{ jobs.build.outputs.build-id }}

jobs:
  build:
    name: windows installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build-id: ${{ steps.meta.outputs.build-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # From __init__.py, not from the ref name — that is the single source of
      # the version ([tool.hatch.version]), and it lets a branch be built, which
      # has no version in its name.
      - name: Read the version and build id
        id: meta
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          $init = Get-Content "src\cellpy_simple_gui\__init__.py" -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') { throw "no __version__" }
          $version = $Matches[1]
          $buildId = ""
          if ($env:CHANNEL) {
            $short = (git rev-parse --short=7 HEAD).Trim()
            $buildId = "$env:CHANNEL.$short"
          }
          Write-Host "version: $version  build-id: '$buildId'"
          "version=$version" >> $env:GITHUB_OUTPUT
          "build-id=$buildId" >> $env:GITHUB_OUTPUT

      - name: Sync build environment
        # --extra desktop is not optional: pywebview moved to an extra in #118,
        # and PyInstaller can only bundle what is installed.
        run: uv sync --extra build --extra desktop --extra export

      - name: Freeze the app
        run: uv run pyinstaller packaging/cellpy-simple-gui.spec --noconfirm

      # The console twin, because a windowed exe has no stdout for the test to
      # read a token from. Same 15 checks the container and PyPI builds face.
      - name: Smoke-test the frozen app
        run: uv run python packaging/smoke_test.py dist/cellpy-simple-gui/cellpy-simple-gui-console.exe

      - name: Compile the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_ID: ${{ steps.meta.outputs.build-id }}
          OUTPUT_BASE_NAME: ${{ inputs.output-base-name }}
        run: |
          # Inno Setup ships on windows-latest (6.7.1 at time of writing), but
          # runner images change; look, then fall back rather than assume.
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Inno Setup not on the runner; installing it."
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $defines = @("/DAppVersion=$env:VERSION")
          if ($env:BUILD_ID) {
            # The display version carries the build id; the Win32 version
            # resource stays numeric (installer.iss keeps the two apart).
            $defines += "/DBuildId=$env:BUILD_ID"
          }
          if ($env:OUTPUT_BASE_NAME) {
            $defines += "/DOutputBaseName=$env:OUTPUT_BASE_NAME"
          }
          Write-Host "ISCC: $iscc  defines: $defines"
          & $iscc @defines "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\installer

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/installer/*.exe
          if-no-files-found: error
